# Injected sanctions screening cases (task 1.7 · R1.5).
#
# Each case renames one synthetic entity so its name is a near-match to a real entry of the
# public OFAC SDN list. Purpose: test the deterministic screener (spec 03, R3.4) on the
# variants that make name screening hard. The injected accounts and their transactions
# stay synthetic; no real person is connected to any transaction in this repository.
#
# expected:
#   TRUE_MATCH  - same person/company as the SDN entry (name variant + consistent DOB/country)
#   FALSE_MATCH - decoy: similar or identical name, but a different person (DOB/country differ)
# role:
#   subject      - attached to an entity that sends laundering transactions in the test split
#   counterparty - attached to a non-laundering counterparty of such an entity
# variant: transliteration | missing_middle_name | swapped_order | diacritics_spacing | alias
#          | legal_form | exact_name_decoy | similar_name_decoy

cases:
  # --- transliteration -------------------------------------------------------------------
  - id: SAN-01
    sdn_ent_num: 30879            # MOKHBER, Mohammad (DOB 01 Sep 1955, Iran)
    variant: transliteration
    expected: TRUE_MATCH
    kind: person
    role: subject
    name: Mohammed Mokhber
    dob: 1955-09-01
    country: Iran
    country_iso2: IR
