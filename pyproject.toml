[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "finint-agent"
version = "0.1.0"
description = "Agentic AML alert investigation with ML scoring, grounded case files and human-in-the-loop review."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Filipe Paço" }]
dependencies = [
    "duckdb>=2.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "typer>=0.29.1",
]

[project.scripts]
finint = "finint.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261111",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
markers = [
  "slow: needs the full dataset or long-running training",
  "live: calls a live LLM or web API",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["finint"]

[tool.mypy]
python_version = "3.12"
files = ["src/finint"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["finint.core.*", "finint.config"]
strict = true
